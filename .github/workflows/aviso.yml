# Aviso push de nueva versión, con dos canales:
# - Pre-release publicada (canal de pruebas) -> tema "actualizaciones-pruebas" (solo móviles con
#   el canal de pruebas activado).
# - Release normal publicada, o pre-release que se pasa a normal -> tema "actualizaciones" (todos).
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio de Firebase).
name: Aviso de nueva versión

on:
  release:
    # "prereleased": se publica una pre-release. "released": se publica una normal o una
    # pre-release pasa a normal. Así cada versión avisa una vez por canal.
    types: [prereleased, released]
  # Para reenviar el aviso de una versión a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión (por ejemplo v1.0.9)"
        required: true

jobs:
  aviso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Enviar aviso a los móviles
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node .github/scripts/enviar-aviso.js
